name: Agent orchestration (graph preflight)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec to inspect (specs/NNN-name)"
        required: true
        default: "001-indicadores-v2"
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-graph:
    name: Validate and resolve SDD dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Run graph unit tests
        run: cargo test --locked --manifest-path scripts/automation/Cargo.toml
      - name: Validate spec files
        env:
          SPEC_NAME: ${{ inputs.spec }}
        run: cargo run --locked --quiet --manifest-path scripts/automation/Cargo.toml -- validate-graph
      - name: Resolve tasks against GitHub Issues (read-only)
        env:
          SPEC_NAME: ${{ inputs.spec }}
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --quiet --manifest-path scripts/automation/Cargo.toml -- resolve-graph
