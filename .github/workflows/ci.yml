# CI/CD da Área VEC
#
#  - A cada push e a cada Pull Request: confere formatação, analisa e testa.
#  - A cada push na branch main (e só se os testes passarem): publica no Fly.io,
#    mas SOMENTE se a variável FLY_DEPLOY do repositório estiver como "true"
#    (GitHub: Settings > Secrets and variables > Actions > Variables).
#    Enquanto ela não existir, nada é publicado e o fluxo fica verde.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar ferramentas do frontend
        run: npm ci

      - name: Verificar e compilar frontend
        run: |
          npm run typecheck
          npm run build
          git diff --exit-code -- frontend/app.js frontend/admin/admin.js frontend/admin/users.js frontend/tailwind.css
          test -z "$(git status --short --untracked-files=all -- frontend/app.js frontend/admin/admin.js frontend/admin/users.js frontend/tailwind.css)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatação (gofmt)
        run: |
          test -z "$(gofmt -l .)" || { echo "Arquivos fora do padrão:"; gofmt -l .; exit 1; }

      - name: Análise estática (go vet)
        run: go vet ./...

      - name: Testes
        run: go test ./...

      - name: Testes de versionamento
        run: |
          test "$(bash scripts/next-version.sh 1.2.3 'feat: novo recurso')" = "1.3.0"
          test "$(bash scripts/next-version.sh 1.2.3 'improve: busca')" = "1.3.0"
          test "$(bash scripts/next-version.sh 1.2.3 'fix: correção')" = "1.2.4"
          test "$(bash scripts/next-version.sh 1.2.3 $'fix: correção\nfeat: novo recurso')" = "1.3.0"
          test "$(bash scripts/next-version.sh 1.2.3 'feat!: breaking change')" = "2.0.0"
          test "$(bash scripts/next-version.sh 1.2.3 'refactor: mudança' 'BREAKING CHANGE: incompatível')" = "2.0.0"

      - name: Compila
        run: go build ./...

  deploy:
    name: Publicar no Fly.io
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-group # nunca dois deploys ao mesmo tempo
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Calcular versão SemVer
        id: version
        shell: bash
        run: |
          version_tag="$(git tag --points-at HEAD --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -n "$version_tag" ]]; then
            app_version="${version_tag#v}"
          else
            latest_tag="$(git tag --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
            if [[ -z "$latest_tag" ]]; then
              base_version="1.0.0"
              commit_range="HEAD"
            else
              base_version="${latest_tag#v}"
              commit_range="${latest_tag}..HEAD"
            fi
            subjects="$(git log --format=%s "$commit_range")"
            bodies="$(git log --format=%b "$commit_range")"
            app_version="$(bash scripts/next-version.sh "$base_version" "$subjects" "$bodies")"
            version_tag="v${app_version}"
          fi
          echo "version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version_tag}" >> "$GITHUB_OUTPUT"
      - name: Registrar tag da versão
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION_TAG"; then
            git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          fi
          git push origin "$VERSION_TAG"
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --build-arg "APP_VERSION=${APP_VERSION}"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
