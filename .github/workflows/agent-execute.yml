name: SDD agent executor (manual pilot)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Approved spec folder"
        type: string
        required: true
        default: "001-indicadores-v2"
      issue:
        description: "Ready issue number to implement (pilot: 14)"
        type: number
        required: true
        default: 14

permissions:
  contents: read

concurrency:
  group: sdd-agent-${{ inputs.spec }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement one approved task
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Verify AI credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY in repository Actions secrets before running this workflow"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preparar Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Validate graph and select requested ready task
        id: task
        env:
          SPEC_NAME: ${{ inputs.spec }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo test --locked --manifest-path scripts/automation/Cargo.toml
          cargo run --locked --quiet --manifest-path scripts/automation/Cargo.toml -- validate-graph
          cargo run --locked --quiet --manifest-path scripts/automation/Cargo.toml -- prepare-agent
      - name: Install project dependencies
        run: npm ci
      - name: Run Codex in workspace-write sandbox
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex exec --sandbox workspace-write --skip-git-repo-check - < .agent-task-prompt.txt
      - name: Reject prohibited changes
        run: |
          git diff --name-only > /tmp/agent-changed.txt
          git ls-files --others --exclude-standard >> /tmp/agent-changed.txt
          if grep -E '^(\.github/|docs/architecture/adr/|specs/|scripts/automation/|backend/.*migrations?/|.*\.env|fly\.toml$)' /tmp/agent-changed.txt; then
            echo "::error::Agent changed protected files"
            exit 1
          fi
          if [ ! -s /tmp/agent-changed.txt ]; then
            echo "::error::Agent produced no tracked or untracked changes"
            exit 1
          fi
      - name: Verify code quality
        run: |
          npm run typecheck
          npm run build
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build ./...
          git diff --exit-code -- frontend/tailwind.css frontend/app.js frontend/contato.js frontend/admin/
      - name: Create implementation PR (never merge or deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.task.outputs.task }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue }}
          SPEC_NAME: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          branch="agent/${TASK_ID,,}-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          echo '.agent-task-prompt.txt' >> .git/info/exclude
          git add -A
          git diff --cached --quiet && { echo "::error::No changes to commit"; exit 1; }
          git commit -m "test: implement ${TASK_ID} from issue #${ISSUE_NUMBER}"
          gh auth setup-git
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh pr create --head "$branch" --base main \
            --title "agent: ${TASK_ID} — Issue #${ISSUE_NUMBER}" \
            --body "Implements #${ISSUE_NUMBER} under specs/${SPEC_NAME}/.\n\nAutomated checks executed in the agent workflow. Review the diff, risk, test evidence and CI before merge. No auto-merge or deploy requested."
