<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcadores — laboratório</title><style>body{font:14px system-ui;background:#f4f6fa;color:#14243d;padding:20px}section{position:relative;height:320px;background:#e5ebe1;border-radius:12px;overflow:hidden}button{font:inherit;cursor:pointer}section button{position:absolute;left:var(--x);top:var(--y);width:48px;height:48px;border:3px solid #2563eb;background:white;color:#2563eb;border-radius:50%;transform:translate(-50%,-50%);transition:transform 180ms,left 350ms,top 350ms}section button:hover{transform:translate(-50%,-50%) scale(1.08)}section button[aria-pressed=true]{outline:3px solid #93b4ff;outline-offset:4px;transform:translate(-50%,-50%) scale(1.15);animation:pulse 2s ease-out 2}section button[hidden]{display:none}@keyframes pulse{from{box-shadow:0 0 0 0 #2563eb55}to{box-shadow:0 0 0 20px #2563eb00}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>Laboratório de marcadores</h1><p>Dados fictícios. Selecione um membro ou alterne o agrupamento.</p><button id="toggle" aria-pressed="false">Agrupar / expandir</button><section aria-label="Mapa esquemático"><button class="person" style="--x:30%;--y:35%" aria-label="Ana Modelo" aria-pressed="false">AM</button><button class="person" style="--x:60%;--y:55%" aria-label="Bruno Modelo" aria-pressed="false">BM</button><button id="cluster" style="--x:45%;--y:45%" hidden aria-label="Expandir duas pessoas">2</button></section><p role="status" id="status">Nenhuma seleção</p><script>const people=[...document.querySelectorAll('.person')],toggle=document.querySelector('#toggle'),cluster=document.querySelector('#cluster'),status=document.querySelector('#status');let grouped=false;function group(v){grouped=v;people.forEach(p=>{p.hidden=v;p.setAttribute('aria-pressed','false')});cluster.hidden=!v;toggle.setAttribute('aria-pressed',String(v));status.textContent=v?'Duas pessoas agrupadas':'Grupo expandido'}toggle.onclick=()=>group(!grouped);cluster.onclick=()=>{group(false);people[0].focus()};people.forEach(p=>p.onclick=()=>{people.forEach(q=>q.setAttribute('aria-pressed',String(q===p)));status.textContent=p.getAttribute('aria-label')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){people.forEach(p=>p.setAttribute('aria-pressed','false'));status.textContent='Nenhuma seleção';toggle.focus()}})</script></html>
