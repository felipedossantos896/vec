# Configuração do Fly.io.
# Referência: https://fly.io/docs/reference/configuration/

# TROQUE pelo nome do seu app: ele precisa ser único em todo o Fly.io
# (ex.: vec-igreja-fulano). O endereço padrão será https://NOME.fly.dev
app = "area-vec"

# São Paulo: crie o banco do Turso na mesma região (aws-sa-east-1).
primary_region = "gru"

# O servidor trata SIGTERM e termina as requisições em andamento antes de sair.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true

  # Modo "sempre ligado": uma máquina que nunca desliga. A primeira visita não
  # espera nada, e o custo é o de uma máquina pequena o mês inteiro.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Modo "economia" (alternativa): a máquina desliga quando ninguém usa e liga
  # na próxima visita (a primeira visita depois de um tempo parado fica mais
  # lenta). Para usar, troque as três linhas acima por:
  #   auto_stop_machines = "stop"
  #   auto_start_machines = true
  #   min_machines_running = 0

  [http_service.concurrency]
    type = "requests"

  # O Fly só manda tráfego para a máquina se este endereço responder 200.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# Tamanho da máquina. IMPORTANTE: se você mudar o tamanho com "fly scale vm",
# o próximo deploy volta a este valor. Para mudar de verdade, edite aqui.
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
